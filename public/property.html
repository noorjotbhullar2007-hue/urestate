<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Details - Urestate</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Navbar -->
<nav class="bg-white shadow p-4">
    <div class="flex justify-between items-center">
        <a href="/public/index.html" class="text-xl font-bold text-blue-600">Urestate</a>
        <button id="menuBtn" class="md:hidden text-gray-700 focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
        <div id="navLinks" class="hidden md:flex space-x-4"></div>
    </div>
    <div id="mobileMenu" class="hidden md:hidden mt-3 flex-col space-y-2"></div>
</nav>

<div class="max-w-4xl mx-auto p-4 mt-6">
    <a href="/public/index.html" class="text-blue-600 hover:underline">&larr; Back to listings</a>
    <div id="propertyDetail" class="bg-white rounded-lg shadow p-6 mt-4">
        <p class="text-gray-500">Loading property details...</p>
    </div>
</div>

<script>
const token = localStorage.getItem('token');
function logoutConfirm() {
    if (confirm('Are you sure you want to logout?')) {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '/public/index.html';
    }
}
if (token) {
    const links = `
        <a href="/public/index.html" class="text-gray-700 hover:text-blue-600 block md:inline">Listings</a>
        <a href="/public/calculator.html" class="text-gray-700 hover:text-blue-600 block md:inline">Calculator</a>
        <a href="/public/add-property.html" class="text-gray-700 hover:text-blue-600 block md:inline">Add Property</a>
        <a href="/public/dashboard.html" class="text-gray-700 hover:text-blue-600 block md:inline">My Dashboard</a>
        <a href="/public/about.html" class="text-gray-700 hover:text-blue-600 block md:inline">About Us</a>
       <button onclick="logoutConfirm()" class="text-red-600 hover:underline block md:inline text-left">Logout</button>
    `;
    document.getElementById('navLinks').innerHTML = links;
    document.getElementById('mobileMenu').innerHTML = links;
  
} else {
    const links = `
        <a href="/public/index.html" class="text-gray-700 hover:text-blue-600 block md:inline">Listings</a>
        <a href="/public/calculator.html" class="text-gray-700 hover:text-blue-600 block md:inline">Calculator</a>
        <a href="/public/login.html" class="text-gray-700 hover:text-blue-600 block md:inline">Login</a>
        <a href="/public/register.html" class="text-gray-700 hover:text-blue-600 block md:inline">Register</a>
        <a href="/public/about.html" class="text-gray-700 hover:text-blue-600 block md:inline">About Us</a>
    `;
    document.getElementById('navLinks').innerHTML = links;
    document.getElementById('mobileMenu').innerHTML = links;
}

document.getElementById('menuBtn').addEventListener('click', () => {
    const menu = document.getElementById('mobileMenu');
    menu.classList.toggle('hidden');
    menu.classList.toggle('flex');
});

const params = new URLSearchParams(window.location.search);
const propertyId = params.get('id');

async function loadPropertyDetails() {
    return new Promise(async (resolve) => {
    const container = document.getElementById('propertyDetail');
    if (!propertyId) {
        container.innerHTML = '<p class="text-red-500">No property selected.</p>';
        return resolve();
    }

    try {
        const res = await fetch(`https://urestate.onrender.com/api/properties/${propertyId}`);
        if (!res.ok) {
            container.innerHTML = '<p class="text-red-500">Property not found.</p>';
            return resolve();
        }
        const p = await res.json();
        window.currentProperty = p;
        const currentUser = JSON.parse(localStorage.getItem('user') || '{}');

        const imagesHtml = (p.images && p.images.length > 0)
    ? `
    <div class="relative w-full h-72 bg-gray-200 rounded overflow-hidden mb-2">
        <!-- Images -->
        ${p.images.map((img, index) => `
            <img src="${img.startsWith('http') ? img : 'https://urestate.onrender.com/' + img.replace(/\\/g,'/')}" 
                class="absolute inset-0 w-full h-full object-cover transition-opacity duration-300 ${index === 0 ? 'opacity-100' : 'opacity-0'}"
                data-index="${index}">
        `).join('')}

        <!-- Left Arrow -->
        ${p.images.length > 1 ? `
        <button onclick="changeImage(-1)" 
            class="absolute left-2 top-1/2 -translate-y-1/2 bg-black bg-opacity-50 text-white w-9 h-9 rounded-full flex items-center justify-center hover:bg-opacity-75 text-lg">
            &#8249;
        </button>

        <!-- Right Arrow -->
        <button onclick="changeImage(1)" 
            class="absolute right-2 top-1/2 -translate-y-1/2 bg-black bg-opacity-50 text-white w-9 h-9 rounded-full flex items-center justify-center hover:bg-opacity-75 text-lg">
            &#8250;
        </button>

        <!-- Dots -->
        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-1">
            ${p.images.map((_, index) => `
                <div class="w-2 h-2 rounded-full ${index === 0 ? 'bg-white' : 'bg-white bg-opacity-50'}" 
                    data-dot="${index}">
                </div>
            `).join('')}
        </div>
        ` : ''}
    </div>
    `
    : '<div class="w-full h-72 bg-gray-200 flex items-center justify-center text-gray-400 rounded">No Image</div>';

        container.innerHTML = `
            ${imagesHtml}

            <!-- Title & Price -->
            <div class="flex justify-between items-start mt-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">${p.title}</h1>
                        <p class="text-gray-500">${p.location}${p.address ? ' — ' + p.address : ''}</p>
                        <p class="text-sm text-gray-400 mt-1">Listed by: <span class="font-semibold text-gray-600">${p.owner_name}</span></p>
                </div>
                <div class="text-right">
                    <p class="text-blue-600 text-2xl font-bold">₹${Number(p.price).toLocaleString()} ${p.purpose === 'rent' ? '/month' : ''}</p>
                    ${p.negotiable_price ? '<span class="text-green-600 text-sm">Price Negotiable</span>' : ''}
                </div>
            </div>

            <!-- Badges -->
            <div class="flex flex-wrap gap-2 mt-3">
                ${p.property_type ? `<span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm">${p.property_type}</span>` : ''}
                ${p.furnished_status ? `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">${p.furnished_status}</span>` : ''}
                ${p.purpose ? `<span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-sm">${p.purpose === 'rent' ? 'For Rent' : 'For Sale'}</span>` : ''}
                ${p.parking ? '<span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-sm">Parking Available</span>' : ''}
            </div>

            <!-- Key Details Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6 bg-gray-50 p-4 rounded-lg">
                ${p.bedrooms ? `<div class="text-center"><p class="text-2xl font-bold text-gray-800">${p.bedrooms}</p><p class="text-gray-500 text-sm">Bedrooms</p></div>` : ''}
                ${p.bathrooms ? `<div class="text-center"><p class="text-2xl font-bold text-gray-800">${p.bathrooms}</p><p class="text-gray-500 text-sm">Bathrooms</p></div>` : ''}
                ${p.balconies ? `<div class="text-center"><p class="text-2xl font-bold text-gray-800">${p.balconies}</p><p class="text-gray-500 text-sm">Balconies</p></div>` : ''}
                ${p.floor_number ? `<div class="text-center"><p class="text-2xl font-bold text-gray-800">${p.floor_number}/${p.total_floors || '?'}</p><p class="text-gray-500 text-sm">Floor</p></div>` : ''}
            </div>

            <!-- Size Details -->
            ${(p.plot_size || p.built_up_area || p.carpet_area) ? `
            <div class="mt-6">
                <h2 class="text-lg font-semibold text-gray-700 mb-3">Size Details</h2>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    ${p.plot_size ? `<div class="bg-gray-50 p-3 rounded"><p class="text-sm text-gray-500">Plot Size</p><p class="font-semibold">${p.plot_size} sq ft</p></div>` : ''}
                    ${p.built_up_area ? `<div class="bg-gray-50 p-3 rounded"><p class="text-sm text-gray-500">Built-up Area</p><p class="font-semibold">${p.built_up_area} sq ft</p></div>` : ''}
                    ${p.carpet_area ? `<div class="bg-gray-50 p-3 rounded"><p class="text-sm text-gray-500">Carpet Area</p><p class="font-semibold">${p.carpet_area} sq ft</p></div>` : ''}
                </div>
            </div>` : ''}

            <!-- Other Details -->
            <div class="mt-6">
                <h2 class="text-lg font-semibold text-gray-700 mb-3">Property Details</h2>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    ${p.property_age ? `<div class="bg-gray-50 p-3 rounded"><p class="text-sm text-gray-500">Property Age</p><p class="font-semibold">${p.property_age}</p></div>` : ''}
                    ${p.facing ? `<div class="bg-gray-50 p-3 rounded"><p class="text-sm text-gray-500">Facing</p><p class="font-semibold">${p.facing}</p></div>` : ''}
                    ${p.ownership_type ? `<div class="bg-gray-50 p-3 rounded"><p class="text-sm text-gray-500">Ownership</p><p class="font-semibold">${p.ownership_type}</p></div>` : ''}
                    ${p.availability_date ? `<div class="bg-gray-50 p-3 rounded"><p class="text-sm text-gray-500">Available From</p><p class="font-semibold">${new Date(p.availability_date).toLocaleDateString()}</p></div>` : ''}
                </div>
            </div>

            <!-- Description -->
            ${p.description ? `
            <div class="mt-6">
                <h2 class="text-lg font-semibold text-gray-700 mb-2">Description</h2>
                <p class="text-gray-600">${p.description}</p>
            </div>` : ''}

            <!-- Nearby Landmarks -->
            ${p.nearby_landmarks ? `
            <div class="mt-6">
                <h2 class="text-lg font-semibold text-gray-700 mb-2">Nearby Landmarks</h2>
                <p class="text-gray-600">${p.nearby_landmarks}</p>
            </div>` : ''}

            <!-- Map -->
            ${p.latitude && p.longitude ? `
            <div class="mt-6">
                <h2 class="text-lg font-semibold text-gray-700 mb-3">Property Location</h2>
                <div id="propertyMap" style="height: 350px; border-radius: 8px;"></div>
            </div>` : ''}

            <!-- Posted date -->
            <p class="text-gray-400 text-sm mt-6">Posted on: ${new Date(p.created_at).toLocaleDateString()}</p>

            <!-- Contact Owner -->
            ${token && currentUser.id !== p.user_id ? `
            <div class="mt-6 border-t pt-6">
                <h2 class="text-lg font-semibold text-gray-700 mb-3">Contact Owner</h2>
                ${p.owner_phone ? `<p class="text-gray-600 mb-3">📞 <span class="font-semibold">${p.owner_phone}</span></p>` : ''}
                ${p.owner_email ? `<p class="text-gray-600 mb-3">📧 <span class="font-semibold">${p.owner_email}</span></p>` : ''}
                <textarea id="messageText" rows="3" placeholder="Write your message here..."
                    class="w-full p-2 border rounded mb-3"></textarea>
                <button onclick="sendMessage(${p.id}, ${p.user_id})"
                    class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
                    Send Message
                </button>
                <p id="msgStatus" class="text-sm mt-2"></p>
            </div>
            ` : ''}

            <!-- Not logged in -->
            ${!token ? `
            <div class="mt-6 border-t pt-6">
                <p class="text-gray-500">Please <a href="/public/login.html" class="text-blue-600">login</a> to contact the owner.</p>
            </div>
            ` : ''}
        `;

        resolve();
    } catch (error) {
        container.innerHTML = '<p class="text-red-500">Error loading property.</p>';
        resolve();
    }
    });
}

async function sendMessage(propertyId, ownerId) {
    const message = document.getElementById('messageText').value;
    const msgStatus = document.getElementById('msgStatus');

    if (!message.trim()) {
        msgStatus.textContent = 'Please write a message first.';
        msgStatus.className = 'text-sm mt-2 text-red-600';
        return;
    }

    try {
        const res = await fetch('https://urestate.onrender.com/api/messages/send', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({
                property_id: propertyId,
                receiver_id: ownerId,
                message: message
            })
        });

        const data = await res.json();

        if (res.ok) {
            msgStatus.textContent = '✅ Message sent successfully!';
            msgStatus.className = 'text-sm mt-2 text-green-600';
            document.getElementById('messageText').value = '';
        } else {
            msgStatus.textContent = data.message;
            msgStatus.className = 'text-sm mt-2 text-red-600';
        }
    } catch (error) {
        msgStatus.textContent = 'Something went wrong. Try again.';
        msgStatus.className = 'text-sm mt-2 text-red-600';
    }
}
let currentImageIndex = 0;

function changeImage(direction) {
    const images = document.querySelectorAll('[data-index]');
    const dots = document.querySelectorAll('[data-dot]');
    const total = images.length;

    // Hide current image
    images[currentImageIndex].classList.remove('opacity-100');
    images[currentImageIndex].classList.add('opacity-0');
    dots[currentImageIndex].classList.remove('bg-white');
    dots[currentImageIndex].classList.add('bg-opacity-50');

    // Calculate next index
    currentImageIndex = (currentImageIndex + direction + total) % total;

    // Show new image
    images[currentImageIndex].classList.remove('opacity-0');
    images[currentImageIndex].classList.add('opacity-100');
    dots[currentImageIndex].classList.add('bg-white');
    dots[currentImageIndex].classList.remove('bg-opacity-50');
}
loadPropertyDetails().then(() => {
    const p = window.currentProperty;
    if (p && p.latitude && p.longitude) {
        const map = L.map('propertyMap').setView([p.latitude, p.longitude], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        L.marker([p.latitude, p.longitude])
            .addTo(map)
            .bindPopup(`<b>${p.title}</b><br>₹${Number(p.price).toLocaleString()}`)
            .openPopup();
    }
});
</script>

</body>
</html>
