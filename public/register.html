<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Urestate</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-lg shadow-md w-96">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Create Account</h1>

    <form id="registerForm">
        <input type="text" id="name" placeholder="Full Name" required
            class="w-full p-2 mb-3 border rounded">

        <input type="email" id="email" placeholder="Email" required
            class="w-full p-2 mb-3 border rounded">

        <input type="password" id="password" placeholder="Password" required
            class="w-full p-2 mb-3 border rounded">

        <input type="text" id="phone" placeholder="Phone Number"
    class="w-full p-2 mb-3 border rounded">

    <input type="text" id="city" placeholder="City"
        class="w-full p-2 mb-4 border rounded">
        <div class="flex items-start gap-2 mb-4">
            <input type="checkbox" id="terms" required class="mt-1">
            <label for="terms" class="text-sm text-gray-600">
                I agree to the 
                <a href="/public/terms.html" target="_blank" class="text-blue-600 hover:underline">
                    Terms & Conditions
                </a>
            </label>
        </div>
        <button type="submit"
            class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
            Register
        </button>
    </form>

    <p id="message" class="text-center mt-4 text-sm"></p>

    <p class="text-center mt-2 text-sm">
        Already have an account? <a href="login.html" class="text-blue-600">Login</a>
    </p>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const phone = document.getElementById('phone').value;
    const messageEl = document.getElementById('message');

    const city = document.getElementById('city').value;

    try {
        const res = await fetch('http://localhost:3000/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password, phone, city })
        });

        const data = await res.json();

        if (res.ok) {
    messageEl.textContent = data.message;
    messageEl.className = 'text-center mt-4 text-sm text-green-600';
    setTimeout(() => window.location.href = `/public/verify-otp.html?email=${encodeURIComponent(data.email)}`, 1500);
} else {
    // Show friendly error messages
    let errorMsg = data.message;
    if (data.error && data.error.code === 'ER_DUP_ENTRY') {
        errorMsg = '❌ This email is already registered. Please login or use a different email.';
    }
    messageEl.textContent = errorMsg;
    messageEl.className = 'text-center mt-4 text-sm text-red-600';
}
    } catch (error) {
        messageEl.textContent = 'Something went wrong. Try again.';
        messageEl.className = 'text-center mt-4 text-sm text-red-600';
    }
});
</script>

</body>
</html>
