<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Urestate</title>
<link rel="icon" type="image/x-icon" href="/public/favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-lg shadow-md w-96">
    <div class="text-center mb-6">
        <div class="text-4xl mb-3">🔑</div>
        <h1 class="text-2xl font-bold text-gray-800">Reset Password</h1>
        <p class="text-gray-500 text-sm mt-2">Enter your new password below.</p>
    </div>

    <form id="resetForm">
        <input type="password" id="newPassword" placeholder="New Password" required
            class="w-full p-2 mb-3 border rounded">

        <input type="password" id="confirmPassword" placeholder="Confirm New Password" required
            class="w-full p-2 mb-4 border rounded">

        <button type="submit"
            class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
            Reset Password
        </button>
    </form>

    <p id="message" class="text-center mt-4 text-sm"></p>
</div>

<script>
// Get token and email from URL
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const email = params.get('email');

// Redirect if no token
if (!token || !email) {
    document.getElementById('message').textContent = '❌ Invalid reset link. Please request a new one.';
    document.getElementById('message').className = 'text-center mt-4 text-sm text-red-600';
    document.getElementById('resetForm').classList.add('hidden');
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const messageEl = document.getElementById('message');

    if (newPassword !== confirmPassword) {
        messageEl.textContent = '❌ Passwords do not match.';
        messageEl.className = 'text-center mt-4 text-sm text-red-600';
        return;
    }

    if (newPassword.length < 6) {
        messageEl.textContent = '❌ Password must be at least 6 characters.';
        messageEl.className = 'text-center mt-4 text-sm text-red-600';
        return;
    }

    try {
        const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, token, newPassword })
        });

        const data = await res.json();

        if (res.ok) {
            messageEl.textContent = '✅ ' + data.message;
            messageEl.className = 'text-center mt-4 text-sm text-green-600';
            setTimeout(() => window.location.href = '/public/login.html', 2000);
        } else {
            messageEl.textContent = '❌ ' + data.message;
            messageEl.className = 'text-center mt-4 text-sm text-red-600';
        }
    } catch (error) {
        messageEl.textContent = 'Something went wrong. Try again.';
        messageEl.className = 'text-center mt-4 text-sm text-red-600';
    }
});
</script>

</body>
</html>
