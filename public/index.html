<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<title>Urestate - Find Your Home</title>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Navbar -->
<nav class="bg-white shadow p-4">
    <div class="flex justify-between items-center">
        <a href="/public/index.html" class="text-xl font-bold text-blue-600">Urestate</a>
        <button id="menuBtn" class="md:hidden text-gray-700 focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
        <div id="navLinks" class="hidden md:flex space-x-4"></div>
    </div>
    <div id="mobileMenu" class="hidden md:hidden mt-3 flex-col space-y-2"></div>
</nav>

<!-- Filters -->
<div class="max-w-6xl mx-auto px-4 pt-4">
    <div class="bg-white rounded-lg shadow p-3">

        <!-- Row 1: Location search (full width) -->
        <input type="text" id="locationFilter" placeholder="🔍 Search by location, address or landmark"
            class="w-full p-2 border rounded mb-2 text-sm">

        <!-- Row 2: Purpose + Type + More Filters + Search + Clear -->
        <div class="flex gap-2 flex-wrap">
            <select id="purposeFilter" class="p-2 border rounded text-sm flex-1 min-w-[100px]">
                <option value="">Any Purpose</option>
                <option value="rent">For Rent</option>
                <option value="sell">For Sale</option>
            </select>
            <select id="typeFilter" class="p-2 border rounded text-sm flex-1 min-w-[100px]">
                <option value="">Any Type</option>
                <option value="Flat">Flat</option>
                <option value="House">House</option>
                <option value="Plot">Plot</option>
                <option value="Commercial">Commercial</option>
            </select>
            <button id="moreFiltersBtn" class="px-3 py-2 border rounded text-sm text-gray-600 hover:bg-gray-50 whitespace-nowrap">
                ⚙️ Filters <span id="filterBadge" class="hidden bg-blue-600 text-white text-xs px-1.5 py-0.5 rounded-full ml-1">0</span>
            </button>
            <button id="searchBtn" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">
                Search
            </button>
            <button id="clearBtn" class="border px-3 py-2 rounded text-sm text-gray-600 hover:bg-gray-50">
                Clear
            </button>
        </div>

        <!-- Advanced Filters (hidden by default) -->
        <div id="advancedFilters" class="hidden border-t pt-3 mt-2">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                <input type="number" id="minPrice" placeholder="Min Price (₹)"
                    class="p-2 border rounded text-sm">
                <input type="number" id="maxPrice" placeholder="Max Price (₹)"
                    class="p-2 border rounded text-sm">
                <select id="bedroomsFilter" class="p-2 border rounded text-sm">
                    <option value="">Any Bedrooms</option>
                    <option value="1">1+ Bedroom</option>
                    <option value="2">2+ Bedrooms</option>
                    <option value="3">3+ Bedrooms</option>
                    <option value="4">4+ Bedrooms</option>
                    <option value="5">5+ Bedrooms</option>
                </select>
                <select id="bathroomsFilter" class="p-2 border rounded text-sm">
                    <option value="">Any Bathrooms</option>
                    <option value="1">1+ Bathroom</option>
                    <option value="2">2+ Bathrooms</option>
                    <option value="3">3+ Bathrooms</option>
                    <option value="4">4+ Bathrooms</option>
                </select>
                <select id="furnishedFilter" class="p-2 border rounded text-sm col-span-2 md:col-span-1">
                    <option value="">Any Furnished Status</option>
                    <option value="Furnished">Furnished</option>
                    <option value="Semi-Furnished">Semi-Furnished</option>
                    <option value="Unfurnished">Unfurnished</option>
                </select>
            </div>
        </div>
    </div>
</div>

<!-- View Toggle -->
<div class="max-w-6xl mx-auto px-4 flex justify-end mt-3 mb-1">
    <div class="flex border rounded overflow-hidden">
        <button id="gridViewBtn" onclick="switchView('grid')"
            class="px-4 py-2 bg-blue-600 text-white text-sm">
            ⊞ Grid
        </button>
        <button id="mapViewBtn" onclick="switchView('map')"
            class="px-4 py-2 bg-white text-gray-600 text-sm hover:bg-gray-50">
            🗺️ Map
        </button>
    </div>
</div>

<!-- Property Listings (Grid) -->
<div id="propertyList" class="max-w-6xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6 mt-2">
</div>

<!-- Map View -->
<div id="mapView" class="hidden max-w-6xl mx-auto p-4 mt-2">
    <div id="allPropertiesMap" style="height: 500px; border-radius: 8px;"></div>
</div>

<script>
function logoutConfirm() {
    if (confirm('Are you sure you want to logout?')) {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.reload();
    }
}

const token = localStorage.getItem('token');

if (token) {
    const links = `
        <a href="/public/index.html" class="text-gray-700 hover:text-blue-600 block md:inline">Listings</a>
        <a href="/public/calculator.html" class="text-gray-700 hover:text-blue-600 block md:inline">Calculator</a>
        <a href="/public/add-property.html" class="text-gray-700 hover:text-blue-600 block md:inline">Add Property</a>
        <a href="/public/dashboard.html" class="text-gray-700 hover:text-blue-600 block md:inline">My Dashboard</a>
        <a href="/public/about.html" class="text-gray-700 hover:text-blue-600 block md:inline">About Us</a>
        <button onclick="logoutConfirm()" class="text-red-600 hover:underline block md:inline text-left">Logout</button>
    `;
    document.getElementById('navLinks').innerHTML = links;
    document.getElementById('mobileMenu').innerHTML = links;
} else {
    const links = `
        <a href="/public/calculator.html" class="text-gray-700 hover:text-blue-600 block md:inline">Calculator</a>
        <a href="/public/login.html" class="text-gray-700 hover:text-blue-600 block md:inline">Login</a>
        <a href="/public/register.html" class="text-gray-700 hover:text-blue-600 block md:inline">Register</a>
        <a href="/public/about.html" class="text-gray-700 hover:text-blue-600 block md:inline">About Us</a>
    `;
    document.getElementById('navLinks').innerHTML = links;
    document.getElementById('mobileMenu').innerHTML = links;
}

document.getElementById('menuBtn').addEventListener('click', () => {
    const menu = document.getElementById('mobileMenu');
    menu.classList.toggle('hidden');
    menu.classList.toggle('flex');
});

async function loadProperties(filters = '') {
    return new Promise(async (resolve) => {
        const propertyList = document.getElementById('propertyList');
        propertyList.innerHTML = '<p class="text-gray-500">Loading properties...</p>';

        try {
            const res = await fetch(`/api/properties${filters}`);
            const properties = await res.json();
            allPropertiesData = properties;

            if (properties.length === 0) {
                propertyList.innerHTML = '<p class="text-gray-500">No properties found.</p>';
                resolve();
                return;
            }

            propertyList.innerHTML = properties.map(p => `
                <a href="/public/property.html?id=${p.id}" class="block bg-white rounded-lg shadow hover:shadow-lg transition overflow-hidden ${p.is_official ? 'border-2 border-yellow-400' : ''}">
                   <div class="relative">
                        ${p.thumbnail
                            ? `<img src="${p.thumbnail.startsWith('http') ? p.thumbnail : '/' + p.thumbnail.replace(/\\/g,'/')}" class="h-48 w-full object-cover ${p.status !== 'available' ? 'opacity-60' : ''}">`
                            : `<div class="h-48 bg-gray-200 flex items-center justify-center text-gray-400">No Image</div>`
                        }
                        ${p.is_official ? `<span class="absolute top-2 left-2 bg-yellow-400 text-yellow-900 text-xs font-bold px-2 py-1 rounded">⭐ Verified by Urestate</span>` : ''}
                        ${p.status === 'sold' ? '<span class="absolute top-2 right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded">✅ SOLD</span>' : ''}
                        ${p.status === 'rented' ? '<span class="absolute top-2 right-2 bg-green-500 text-white text-xs font-bold px-2 py-1 rounded">🔑 RENTED</span>' : ''}
                    </div>
                    <div class="p-4">
                        <h2 class="font-bold text-lg text-gray-800">${p.title}</h2>
                        <p class="text-gray-500">${p.location}</p>
                        <p class="text-blue-600 font-semibold mt-2">₹${Number(p.price).toLocaleString()} ${p.purpose === 'rent' ? '/month' : ''}</p>
                        <span class="text-xs bg-gray-100 px-2 py-1 rounded">${p.property_type || ''}</span>
                    </div>
                </a>
            `).join('');
            resolve();
        } catch (error) {
            propertyList.innerHTML = '<p class="text-red-500">Error loading properties.</p>';
            resolve();
        }
    });
}

loadProperties();

document.getElementById('moreFiltersBtn').addEventListener('click', () => {
    const advancedFilters = document.getElementById('advancedFilters');
    advancedFilters.classList.toggle('hidden');
    const isOpen = !advancedFilters.classList.contains('hidden');
    document.getElementById('moreFiltersBtn').innerHTML = isOpen
        ? '⚙️ Less <span id="filterBadge" class="hidden bg-blue-600 text-white text-xs px-1.5 py-0.5 rounded-full ml-1">0</span>'
        : '⚙️ Filters <span id="filterBadge" class="hidden bg-blue-600 text-white text-xs px-1.5 py-0.5 rounded-full ml-1">0</span>';
});

document.getElementById('searchBtn').addEventListener('click', () => {
    const location = document.getElementById('locationFilter').value;
    const purpose = document.getElementById('purposeFilter').value;
    const type = document.getElementById('typeFilter').value;
    const minPrice = document.getElementById('minPrice').value;
    const maxPrice = document.getElementById('maxPrice').value;
    const bedrooms = document.getElementById('bedroomsFilter').value;
    const bathrooms = document.getElementById('bathroomsFilter').value;
    const furnished = document.getElementById('furnishedFilter').value;

    const params = new URLSearchParams();
    if (location) params.append('location', location);
    if (purpose) params.append('purpose', purpose);
    if (type) params.append('property_type', type);
    if (minPrice) params.append('minPrice', minPrice);
    if (maxPrice) params.append('maxPrice', maxPrice);
    if (bedrooms) params.append('bedrooms', bedrooms);
    if (bathrooms) params.append('bathrooms', bathrooms);
    if (furnished) params.append('furnished_status', furnished);

    const activeFilters = [location, purpose, type, minPrice, maxPrice, bedrooms, bathrooms, furnished].filter(Boolean).length;
    const badge = document.getElementById('filterBadge');
    if (activeFilters > 0) {
        badge.textContent = activeFilters;
        badge.classList.remove('hidden');
    } else {
        badge.classList.add('hidden');
    }

    loadProperties('?' + params.toString()).then(() => {
        if (currentView === 'map') initMap();
    });
});

document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('locationFilter').value = '';
    document.getElementById('purposeFilter').value = '';
    document.getElementById('typeFilter').value = '';
    document.getElementById('minPrice').value = '';
    document.getElementById('maxPrice').value = '';
    document.getElementById('bedroomsFilter').value = '';
    document.getElementById('bathroomsFilter').value = '';
    document.getElementById('furnishedFilter').value = '';
    document.getElementById('filterBadge').classList.add('hidden');
    loadProperties().then(() => {
        if (currentView === 'map') initMap();
    });
});

let mapInstance = null;
let currentView = 'grid';
let allPropertiesData = [];

function switchView(view) {
    currentView = view;
    if (view === 'grid') {
        document.getElementById('propertyList').classList.remove('hidden');
        document.getElementById('mapView').classList.add('hidden');
        document.getElementById('gridViewBtn').className = 'px-4 py-2 bg-blue-600 text-white text-sm';
        document.getElementById('mapViewBtn').className = 'px-4 py-2 bg-white text-gray-600 text-sm hover:bg-gray-50';
    } else {
        document.getElementById('propertyList').classList.add('hidden');
        document.getElementById('mapView').classList.remove('hidden');
        document.getElementById('gridViewBtn').className = 'px-4 py-2 bg-white text-gray-600 text-sm hover:bg-gray-50';
        document.getElementById('mapViewBtn').className = 'px-4 py-2 bg-blue-600 text-white text-sm';
        initMap();
    }
}

function initMap() {
    if (mapInstance) {
        mapInstance.remove();
        mapInstance = null;
    }

    const defaultCenter = [31.6340, 74.8723];
    mapInstance = L.map('allPropertiesMap').setView(defaultCenter, 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(mapInstance);

    const propertiesWithLocation = allPropertiesData.filter(p => p.latitude && p.longitude);

    if (propertiesWithLocation.length === 0) {
        document.getElementById('allPropertiesMap').innerHTML =
            '<div class="flex items-center justify-center h-full bg-gray-100 rounded-lg"><p class="text-gray-500">No properties with GPS location found.</p></div>';
        return;
    }

    const bounds = [];
    propertiesWithLocation.forEach(p => {
        const marker = L.marker([p.latitude, p.longitude]).addTo(mapInstance);
        marker.bindPopup(`
            <div style="min-width: 150px">
                <b>${p.title}</b><br>
                <span style="color: #2563eb">₹${Number(p.price).toLocaleString()} ${p.purpose === 'rent' ? '/month' : ''}</span><br>
                <span style="color: #6b7280">${p.location}</span><br>
                <a href="/public/property.html?id=${p.id}" style="color: #2563eb; text-decoration: underline;">View Details →</a>
            </div>
        `);
        bounds.push([p.latitude, p.longitude]);
    });

    if (bounds.length > 0) {
        mapInstance.fitBounds(bounds, { padding: [50, 50] });
    }
}
</script>

</body>
</html>
