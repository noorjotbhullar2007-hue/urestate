<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email - Urestate</title>
<link rel="icon" type="image/x-icon" href="/public/favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-lg shadow-md w-96">
    <div class="text-center mb-6">
        <div class="text-4xl mb-3">📧</div>
        <h1 class="text-2xl font-bold text-gray-800">Verify Your Email</h1>
        <p class="text-gray-500 text-sm mt-2">We sent a 6-digit OTP to your email. Please enter it below.</p>
    </div>

    <form id="verifyForm">
        <input type="email" id="email" placeholder="Your Email" required
            class="w-full p-2 mb-3 border rounded">

        <input type="text" id="otp" placeholder="Enter 6-digit OTP" required
            maxlength="6" class="w-full p-2 mb-4 border rounded text-center text-2xl tracking-widest font-bold">

        <button type="submit"
            class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
            Verify Email
        </button>
    </form>

    <p id="message" class="text-center mt-4 text-sm"></p>
    <p class="text-center mt-4 text-xs text-orange-500">
        📩 Can't find the email? Please check your Spam/Junk folder.
    </p>
    <p class="text-center mt-4 text-sm text-gray-500">
        Didn't receive the OTP? 
        <a href="/public/register.html" class="text-blue-600 hover:underline">Register again</a>
    </p>

    <p class="text-center mt-2 text-sm">
        Already verified? <a href="/public/login.html" class="text-blue-600">Login</a>
    </p>
</div>

<script>
// Pre-fill email if passed from register page
const params = new URLSearchParams(window.location.search);
const emailFromRegister = params.get('email');
if (emailFromRegister) {
    document.getElementById('email').value = emailFromRegister;
}

document.getElementById('verifyForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const otp = document.getElementById('otp').value;
    const messageEl = document.getElementById('message');

    try {
        const res = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, otp })
        });

        const data = await res.json();

        if (res.ok) {
            messageEl.textContent = '✅ ' + data.message;
            messageEl.className = 'text-center mt-4 text-sm text-green-600';
            setTimeout(() => window.location.href = '/public/login.html', 2000);
        } else {
            messageEl.textContent = '❌ ' + data.message;
            messageEl.className = 'text-center mt-4 text-sm text-red-600';
        }
    } catch (error) {
        messageEl.textContent = 'Something went wrong. Try again.';
        messageEl.className = 'text-center mt-4 text-sm text-red-600';
    }
});
</script>

</body>
</html>
