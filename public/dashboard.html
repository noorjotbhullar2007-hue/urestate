<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard - Urestate</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Navbar -->
<nav class="bg-white shadow p-4">
    <div class="flex justify-between items-center">
        <a href="/public/index.html" class="text-xl font-bold text-blue-600">Urestate</a>
        <button id="menuBtn" class="md:hidden text-gray-700 focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
        <div class="hidden md:flex space-x-4">
            <a href="/public/index.html" class="text-gray-700 hover:text-blue-600">Listings</a>
            <a href="/public/calculator.html" class="text-gray-700 hover:text-blue-600">Calculator</a>
            <a href="/public/add-property.html" class="text-gray-700 hover:text-blue-600">Add Property</a>
            <a href="/public/about.html" class="text-gray-700 hover:text-blue-600">About Us</a>
            <button id="logoutBtn" class="text-red-600 hover:underline">Logout</button>
        </div>
    </div>
    <div id="mobileMenu" class="hidden md:hidden mt-3 flex-col space-y-2">
        <a href="/public/index.html" class="text-gray-700 hover:text-blue-600 block">Listings</a>
        <a href="/public/calculator.html" class="text-gray-700 hover:text-blue-600 block">Calculator</a>
        <a href="/public/add-property.html" class="text-gray-700 hover:text-blue-600 block">Add Property</a>
        <a href="/public/about.html" class="text-gray-700 hover:text-blue-600 block">About Us</a>
        <button id="logoutBtnMobile" class="text-red-600 hover:underline text-left">Logout</button>
    </div>
</nav>

<div class="max-w-6xl mx-auto p-4 mt-6">

 <!-- Profile Card — Always visible at top -->
<div id="topProfile" class="bg-white rounded-lg shadow p-6 mb-6">
    <div class="flex items-center gap-4 mb-6">
        <div id="profileAvatar" class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-2xl font-bold text-blue-600">
            ?
        </div>
        <div>
            <h2 id="profileName" class="text-xl font-bold text-gray-800">Loading...</h2>
            <p id="profileMemberSince" class="text-gray-500 text-sm"></p>
        </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-gray-50 p-3 rounded">
            <p class="text-sm text-gray-500">Full Name</p>
            <p id="profileFullName" class="font-semibold text-gray-800">-</p>
        </div>
        <div class="bg-gray-50 p-3 rounded">
            <p class="text-sm text-gray-500">Email</p>
            <p id="profileEmail" class="font-semibold text-gray-800">-</p>
        </div>
        <div class="bg-gray-50 p-3 rounded">
            <p class="text-sm text-gray-500">Phone</p>
            <p id="profilePhone" class="font-semibold text-gray-800">-</p>
        </div>
        <div class="bg-gray-50 p-3 rounded">
            <p class="text-sm text-gray-500">City</p>
            <p id="profileCity" class="font-semibold text-gray-800">-</p>
        </div>
    </div>
</div>

    <h1 class="text-2xl font-bold text-gray-800 mb-6">My Dashboard</h1>

    <!-- Tabs -->
    <div class="flex border-b mb-6 flex-wrap">
        <button id="listingsTab" onclick="switchTab('listings')"
            class="px-6 py-2 font-semibold text-blue-600 border-b-2 border-blue-600">
            My Listings
        </button>
        <button id="messagesTab" onclick="switchTab('messages')"
            class="px-6 py-2 font-semibold text-gray-500 hover:text-blue-600">
            Messages <span id="unreadBadge" class="hidden bg-red-500 text-white text-xs px-2 py-0.5 rounded-full ml-1">0</span>
        </button>
        <button id="sentTab" onclick="switchTab('sent')"
            class="px-6 py-2 font-semibold text-gray-500 hover:text-blue-600">
            Sent
        </button>
        
    </div>

    <!-- My Listings Section -->
    <div id="listingsSection">
        <div id="myProperties" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p class="text-gray-500">Loading your properties...</p>
        </div>
    </div>

    <!-- Messages Section -->
    <div id="messagesSection" class="hidden">
        <div id="messagesList">
            <p class="text-gray-500">Loading messages...</p>
        </div>
    </div>

    <!-- Sent Section -->
    <div id="sentSection" class="hidden">
        <div id="sentList">
            <p class="text-gray-500">Loading sent messages...</p>
        </div>
    </div>

  
</div>

<script>
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || 'null');

if (!token || !user) {
    window.location.href = '/public/login.html';
}

// Logout buttons
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('logoutBtnMobile').addEventListener('click', logout);
function logout() {
    if (confirm('Are you sure you want to logout?')) {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '/public/index.html';
    }
}

// Hamburger menu
document.getElementById('menuBtn').addEventListener('click', () => {
    const menu = document.getElementById('mobileMenu');
    menu.classList.toggle('hidden');
    menu.classList.toggle('flex');
});

// Tab switching
function switchTab(tab) {
    document.getElementById('listingsSection').classList.add('hidden');
    document.getElementById('messagesSection').classList.add('hidden');
    document.getElementById('sentSection').classList.add('hidden');
   

    document.getElementById('listingsTab').className = 'px-6 py-2 font-semibold text-gray-500 hover:text-blue-600';
    document.getElementById('messagesTab').className = 'px-6 py-2 font-semibold text-gray-500 hover:text-blue-600';
    document.getElementById('sentTab').className = 'px-6 py-2 font-semibold text-gray-500 hover:text-blue-600';
    

    if (tab === 'listings') {
        document.getElementById('listingsSection').classList.remove('hidden');
        document.getElementById('listingsTab').className = 'px-6 py-2 font-semibold text-blue-600 border-b-2 border-blue-600';
    } else if (tab === 'messages') {
        document.getElementById('messagesSection').classList.remove('hidden');
        document.getElementById('messagesTab').className = 'px-6 py-2 font-semibold text-blue-600 border-b-2 border-blue-600';
        loadMessages();
    } else if (tab === 'sent') {
        document.getElementById('sentSection').classList.remove('hidden');
        document.getElementById('sentTab').className = 'px-6 py-2 font-semibold text-blue-600 border-b-2 border-blue-600';
        loadSentMessages();
    } 
}

// Load unread count for badge
async function loadUnreadCount() {
    try {
        const res = await fetch('https://urestate.onrender.com/api/messages/unread', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        const badge = document.getElementById('unreadBadge');
        if (data.unread_count > 0) {
            badge.textContent = data.unread_count;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    } catch (error) {
        console.error('Error loading unread count');
    }
}

async function loadTopProfile() {
    try {
        const res = await fetch('https://urestate.onrender.com/api/auth/profile', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const profile = await res.json();

        document.getElementById('profileAvatar').textContent = profile.name.charAt(0).toUpperCase();
        document.getElementById('profileName').textContent = profile.name;
        document.getElementById('profileMemberSince').textContent = 'Member since ' + new Date(profile.created_at).toLocaleDateString();
        document.getElementById('profileFullName').textContent = profile.name;
        document.getElementById('profileEmail').textContent = profile.email;
        document.getElementById('profilePhone').textContent = profile.phone || 'Not provided';
        document.getElementById('profileCity').textContent = profile.city || 'Not provided';
    } catch (error) {
        console.error('Error loading top profile');
    }
}

// Load received messages (4.3, 4.4)
async function loadMessages() {
    const container = document.getElementById('messagesList');
    container.innerHTML = '<p class="text-gray-500">Loading messages...</p>';

    try {
        const res = await fetch('https://urestate.onrender.com/api/messages/conversations', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const messages = await res.json();

        if (messages.length === 0) {
            container.innerHTML = '<p class="text-gray-500">No messages yet.</p>';
            return;
        }

        container.innerHTML = messages.map(m => `
            <div class="bg-white rounded-lg shadow p-4 mb-4 ${m.is_read === 0 ? 'border-l-4 border-blue-600' : ''}">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <p class="font-semibold text-gray-800">${m.sender_name}</p>
                        ${m.sender_phone ? `<p class="text-sm text-gray-500">📞 ${m.sender_phone}</p>` : ''}
                        ${m.sender_email ? `<p class="text-sm text-gray-500">📧 ${m.sender_email}</p>` : ''}
                        <p class="text-sm font-semibold text-blue-600 mt-1">🏠 ${m.property_title}</p>
                    </div>
                    <p class="text-xs text-gray-400">${new Date(m.created_at).toLocaleDateString()}</p>
                </div>
                <p class="text-gray-700 mb-3">${m.message}</p>
                <div id="replyForm-${m.id}" class="hidden">
                    <textarea id="replyText-${m.id}" rows="2" placeholder="Write your reply..."
                        class="w-full p-2 border rounded mb-2"></textarea>
                    <button onclick="sendReply(${m.property_id}, ${m.sender_id}, ${m.id})"
                        class="bg-blue-600 text-white px-4 py-1 rounded hover:bg-blue-700 text-sm">
                        Send Reply
                    </button>
                    <p id="replyStatus-${m.id}" class="text-sm mt-1"></p>
                </div>
                <button onclick="toggleReply(${m.id})"
                    class="text-blue-600 hover:underline text-sm">
                    Reply
                </button>
            </div>
        `).join('');

        // Mark all as read (4.3)
        await fetch('https://urestate.onrender.com/api/messages/conversations/read', {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        loadUnreadCount();

    } catch (error) {
        container.innerHTML = '<p class="text-red-500">Error loading messages.</p>';
    }
}

// Load sent messages
async function loadSentMessages() {
    const container = document.getElementById('sentList');
    container.innerHTML = '<p class="text-gray-500">Loading sent messages...</p>';

    try {
        const res = await fetch('https://urestate.onrender.com/api/messages/sent', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const messages = await res.json();

        if (messages.length === 0) {
            container.innerHTML = '<p class="text-gray-500">No sent messages yet.</p>';
            return;
        }

        container.innerHTML = messages.map(m => `
            <div class="bg-white rounded-lg shadow p-4 mb-4">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <p class="font-semibold text-gray-800">To: ${m.receiver_name}</p>
                        <p class="text-sm font-semibold text-blue-600 mt-1">🏠 ${m.property_title}</p>
                    </div>
                    <p class="text-xs text-gray-400">${new Date(m.created_at).toLocaleDateString()}</p>
                </div>
                <p class="text-gray-700">${m.message}</p>
            </div>
        `).join('');
    } catch (error) {
        container.innerHTML = '<p class="text-red-500">Error loading sent messages.</p>';
    }
}

// Toggle reply form
function toggleReply(messageId) {
    const form = document.getElementById(`replyForm-${messageId}`);
    form.classList.toggle('hidden');
}

// Send reply
async function sendReply(propertyId, receiverId, messageId) {
    const replyText = document.getElementById(`replyText-${messageId}`).value;
    const statusEl = document.getElementById(`replyStatus-${messageId}`);

    if (!replyText.trim()) {
        statusEl.textContent = 'Please write a reply first.';
        statusEl.className = 'text-sm mt-1 text-red-600';
        return;
    }

    try {
        const res = await fetch('https://urestate.onrender.com/api/messages/reply', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({
                property_id: propertyId,
                receiver_id: receiverId,
                message: replyText
            })
        });

        const data = await res.json();

        if (res.ok) {
            statusEl.textContent = '✅ Reply sent!';
            statusEl.className = 'text-sm mt-1 text-green-600';
            document.getElementById(`replyText-${messageId}`).value = '';
        } else {
            statusEl.textContent = data.message;
            statusEl.className = 'text-sm mt-1 text-red-600';
        }
    } catch (error) {
        statusEl.textContent = 'Something went wrong.';
        statusEl.className = 'text-sm mt-1 text-red-600';
    }
}

// Load properties
async function loadMyProperties() {
    const container = document.getElementById('myProperties');

    try {
        const res = await fetch('https://urestate.onrender.com/api/properties');
        const allProperties = await res.json();
        const myProperties = allProperties.filter(p => p.user_id === user.id);

        if (myProperties.length === 0) {
            container.innerHTML = '<p class="text-gray-500">You haven\'t posted any properties yet.</p>';
            return;
        }

        container.innerHTML = myProperties.map(p => `
            <div class="bg-white rounded-lg shadow overflow-hidden">
                ${p.thumbnail
                    ? `<img src="${p.thumbnail.startsWith('http') ? p.thumbnail : 'https://urestate.onrender.com/' + p.thumbnail.replace(/\\/g,'/')}" class="h-48 w-full object-cover">`
                    : `<div class="h-48 bg-gray-200 flex items-center justify-center text-gray-400">No Image</div>`
                }
                <div class="p-4">
                    <h2 class="font-bold text-lg text-gray-800">${p.title}</h2>
                    <p class="text-gray-500">${p.location}</p>
                    <p class="text-blue-600 font-semibold mt-2">₹${Number(p.price).toLocaleString()} ${p.purpose === 'rent' ? '/month' : ''}</p>
                    <div class="flex justify-between mt-4">
                        <a href="/public/property.html?id=${p.id}" class="text-blue-600 hover:underline text-sm">View</a>
                        <a href="/public/edit-property.html?id=${p.id}" class="text-green-600 hover:underline text-sm">Edit</a>
                        <button onclick="deleteProperty(${p.id})" class="text-red-600 hover:underline text-sm">Delete</button>
                    </div>
                </div>
            </div>
        `).join('');
    } catch (error) {
        container.innerHTML = '<p class="text-red-500">Error loading your properties.</p>';
    }
}

async function deleteProperty(id) {
    if (!confirm('Are you sure you want to delete this property?')) return;

    try {
        const res = await fetch(`https://urestate.onrender.com/api/properties/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });

        const data = await res.json();

        if (res.ok) {
            loadMyProperties();
        } else {
            alert(data.message);
        }
    } catch (error) {
        alert('Error deleting property.');
    }
}

// Full profile tab


// Initial load
loadMyProperties();
loadUnreadCount();
loadTopProfile();
</script>

</body>
</html>
