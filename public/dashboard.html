<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard - Urestate</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Navbar -->
<nav class="bg-white shadow p-4 flex justify-between items-center">
    <a href="/public/index.html" class="text-xl font-bold text-blue-600">Urestate</a>
    <div class="space-x-4">
        <a href="/public/add-property.html" class="text-gray-700 hover:text-blue-600">Add Property</a>
        <a href="/public/calculator.html" class="text-gray-700 hover:text-blue-600">Calculator</a>
        <button id="logoutBtn" class="text-red-600 hover:underline">Logout</button>
    </div>
</nav>

<div class="max-w-6xl mx-auto p-4 mt-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">My Listings</h1>

    <div id="myProperties" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <p class="text-gray-500">Loading your properties...</p>
    </div>
</div>

<script>
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || 'null');

// Redirect to login if not logged in
if (!token || !user) {
    window.location.href = '/public/login.html';
}

document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = '/public/index.html';
});

async function loadMyProperties() {
    const container = document.getElementById('myProperties');

    try {
        const res = await fetch('http://localhost:3000/api/properties');
        const allProperties = await res.json();

        // Filter only this user's properties
        const myProperties = allProperties.filter(p => p.user_id === user.id);

        if (myProperties.length === 0) {
            container.innerHTML = '<p class="text-gray-500">You haven\'t posted any properties yet.</p>';
            return;
        }

        container.innerHTML = myProperties.map(p => `
            <div class="bg-white rounded-lg shadow overflow-hidden">
                ${p.thumbnail 
                    ? `<img src="http://localhost:3000/${p.thumbnail.replace(/\\/g,'/')}" class="h-48 w-full object-cover">`
                    : `<div class="h-48 bg-gray-200 flex items-center justify-center text-gray-400">No Image</div>`
                }
                <div class="p-4">
                    <h2 class="font-bold text-lg text-gray-800">${p.title}</h2>
                    <p class="text-gray-500">${p.location}</p>
                    <p class="text-blue-600 font-semibold mt-2">₹${p.price} ${p.purpose === 'rent' ? '/month' : ''}</p>
                    <div class="flex justify-between mt-4">
                        <a href="/public/property.html?id=${p.id}" class="text-blue-600 hover:underline text-sm">View</a>
                        <a href="/public/edit-property.html?id=${p.id}" class="text-green-600 hover:underline text-sm">Edit</a>
                        <button onclick="deleteProperty(${p.id})" class="text-red-600 hover:underline text-sm">Delete</button>
                    </div>
                </div>
            </div>
        `).join('');
    } catch (error) {
        container.innerHTML = '<p class="text-red-500">Error loading your properties.</p>';
    }
}

async function deleteProperty(id) {
    if (!confirm('Are you sure you want to delete this property?')) return;

    try {
        const res = await fetch(`http://localhost:3000/api/properties/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });

        const data = await res.json();

        if (res.ok) {
            loadMyProperties(); // Refresh list
        } else {
            alert(data.message);
        }
    } catch (error) {
        alert('Error deleting property.');
    }
}

loadMyProperties();
</script>

</body>
</html>
